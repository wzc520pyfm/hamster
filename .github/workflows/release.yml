# Build Linux / Windows / macOS installers in parallel and publish one GitHub Release.
# Early 0.x tags are marked prerelease. Packages are unsigned.
name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux
            os: ubuntu-latest
            dist_script: dist:linux
            artifact_pattern: electron/dist/*.AppImage
          - platform: windows
            os: windows-latest
            dist_script: dist:win
            artifact_pattern: electron/dist/*.exe
          - platform: macos
            os: macos-latest
            dist_script: dist:mac
            artifact_pattern: electron/dist/*.dmg
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: electron/package-lock.json

      - name: Install Electron package deps
        working-directory: electron
        run: npm ci

      - name: Build ${{ matrix.platform }} package
        working-directory: electron
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: npm run ${{ matrix.dist_script }}

      - name: Upload ${{ matrix.platform }} artifact
        uses: actions/upload-artifact@v4
        with:
          name: hamster-${{ matrix.platform }}
          path: ${{ matrix.artifact_pattern }}
          if-no-files-found: error
          retention-days: 14

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Resolve prerelease flag
        id: meta
        run: |
          TAG="${GITHUB_REF_NAME}"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          case "${TAG}" in
            v0.*) echo "prerelease=true" >> "$GITHUB_OUTPUT" ;;
            *) echo "prerelease=false" >> "$GITHUB_OUTPUT" ;;
          esac

      - name: Download all platform artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: List release assets
        id: assets
        run: |
          shopt -s nullglob
          files=(release-assets/*)
          if [ "${#files[@]}" -lt 3 ]; then
            echo "Expected at least 3 installer assets, found ${#files[@]}" >&2
            find release-assets -type f -print || true
            exit 1
          fi
          echo "count=${#files[@]}" >> "$GITHUB_OUTPUT"
          ls -lah release-assets

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: ${{ steps.meta.outputs.tag }}
          generate_release_notes: true
          prerelease: ${{ steps.meta.outputs.prerelease == 'true' }}
          files: release-assets/*
          body: |
            Exploratory Hamster cut `${{ steps.meta.outputs.tag }}`.

            **Install packages** (unsigned early builds; ${{ steps.assets.outputs.count }} assets):
            - Linux x64: `*.AppImage` — `chmod +x` then run
            - Windows x64: `*.exe` (NSIS)
            - macOS (Apple Silicon runner): `*.dmg` — Gatekeeper will warn on unsigned apps

            See `CHANGELOG.md` for human-written notes. Compose contract evidence
            (when available) lives under `docs/p0-report.md`.
