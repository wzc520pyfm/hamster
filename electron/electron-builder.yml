# Private Electron packaging for early 0.x cuts.
# Inspired by the cc-switch release asset matrix (multi-arch + multiple formats),
# adapted to electron-builder. Unsigned / no updater / no notarization yet.
#
# SANDBOX must pass (Linux AppImage): linux.executableArgs: [] overrides legacy
# fuse2 default desktop Exec=AppRun --no-sandbox. afterPack installs fail-closed
# AppRun that overwrites vendor generateAppRunScript (fail-open on unshare probe).
appId: com.hamster.p1.electron
productName: Hamster
# Default name; nsis/portable override below so Setup vs Portable do not collide.
artifactName: Hamster-v${version}-${os}-${arch}.${ext}
directories:
  output: dist
afterPack: ./appimageAfterPack.cjs
linux:
  target:
    - AppImage
    - deb
    - rpm
  maintainer: hamster
  category: Utility
  # Empty array required: omitting executableArgs restores upstream default ["--no-sandbox"].
  executableArgs: []
win:
  target:
    - nsis
    - portable
  # Unsigned early builds; do not require a code-signing certificate.
  signAndEditExecutable: false
mac:
  target:
    - dmg
    - zip
  # Unsigned early builds (Gatekeeper will warn). identity null disables signing.
  identity: null
  category: public.app-category.productivity
  # macOS 15+ Local Network privacy (TN3179): without this key, TCP to LAN
  # origins (e.g. http://192.168.x.x:3000) is denied silently — no prompt, and
  # the Connect gate only shows 无法连接 / Can't reach this Hamster.
  extendInfo:
    NSLocalNetworkUsageDescription: "Hamster connects to your self-hosted client on the local network."
nsis:
  oneClick: true
  perMachine: false
  allowToChangeInstallationDirectory: false
  artifactName: Hamster-v${version}-Windows-${arch}-Setup.${ext}
portable:
  artifactName: Hamster-v${version}-Windows-${arch}-Portable.${ext}
files:
  - main.js
  - preload.js
  - gate.html
  - hamsterOrigin.cjs
  - machoUuid.cjs
  - sessionStore.cjs
  - windowLoadGuard.cjs
  - mainIpcAuth.cjs
  - notifyPendingApprovals.cjs
  - build/**
  - package.json
