# Multi-arch / multi-format Electron installers → one GitHub Release.
# Asset coverage mirrors cc-switch-style releases (AppImage/deb/rpm, Setup+Portable,
# macOS dmg+zip across arches), without signing / updater / notarization yet.
# Early 0.x tags are marked prerelease.
name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux x64 — AppImage + deb + rpm (native)
          - platform: linux-x64
            os: ubuntu-22.04
            dist_script: dist:linux
            electron_args: --x64
            artifact_pattern: |
              electron/dist/*.AppImage
              electron/dist/*.deb
              electron/dist/*.rpm
          # Linux arm64 — AppImage + deb + rpm
          # Cross-package on x64: electron-builder's bundled fpm is x86-only and
          # cannot Exec on ubuntu-*-arm runners (Exec format error).
          - platform: linux-arm64
            os: ubuntu-22.04
            dist_script: dist:linux
            electron_args: --arm64
            artifact_pattern: |
              electron/dist/*.AppImage
              electron/dist/*.deb
              electron/dist/*.rpm
          # Windows x64 — NSIS Setup + Portable
          - platform: windows-x64
            os: windows-2022
            dist_script: dist:win
            electron_args: --x64
            artifact_pattern: electron/dist/*.exe
          # Windows arm64 — NSIS Setup + Portable
          - platform: windows-arm64
            os: windows-11-arm
            dist_script: dist:win
            electron_args: --arm64
            artifact_pattern: electron/dist/*.exe
          # macOS arm64 — dmg + zip (macos-15 often queued/cancelled on private repos)
          - platform: macos-arm64
            os: macos-latest
            dist_script: dist:mac
            electron_args: --arm64
            artifact_pattern: |
              electron/dist/*.dmg
              electron/dist/*.zip
          # macOS Intel — dmg + zip
          - platform: macos-x64
            os: macos-13
            dist_script: dist:mac
            electron_args: --x64
            artifact_pattern: |
              electron/dist/*.dmg
              electron/dist/*.zip
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: electron/package-lock.json

      - name: Install Linux packaging deps (rpm)
        if: runner.os == 'Linux'
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends rpm

      - name: Install Electron package deps
        working-directory: electron
        run: npm ci

      - name: Build ${{ matrix.platform }} packages
        working-directory: electron
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: npm run ${{ matrix.dist_script }} -- ${{ matrix.electron_args }}

      - name: Normalize asset names (cc-switch style)
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-assets
          shopt -s nullglob
          VERSION="${GITHUB_REF_NAME}"

          rename_one() {
            local src="$1"
            local base dest
            base="$(basename "$src")"
            # Already using Hamster-v* from electron-builder — keep, but map os tokens.
            dest="$base"
            dest="${dest//-linux-/-Linux-}"
            dest="${dest//-mac-/-macOS-}"
            dest="${dest//-win-/-Windows-}"
            # Prefer tag in the name when builder used package.json version only.
            if [[ "$dest" != Hamster-"$VERSION"-* && "$dest" == Hamster-v* ]]; then
              :
            fi
            cp -f "$src" "release-assets/$dest"
            echo "asset: $dest"
          }

          for f in electron/dist/*.AppImage electron/dist/*.deb electron/dist/*.rpm \
                   electron/dist/*.exe electron/dist/*.dmg electron/dist/*.zip; do
            rename_one "$f"
          done

          count=$(find release-assets -type f | wc -l | tr -d ' ')
          echo "Collected $count assets for ${{ matrix.platform }}"
          ls -lah release-assets
          if [ "$count" -lt 1 ]; then
            echo "No release assets produced" >&2
            ls -lah electron/dist || true
            exit 1
          fi

      - name: Upload ${{ matrix.platform }} artifacts
        uses: actions/upload-artifact@v4
        with:
          name: hamster-${{ matrix.platform }}
          path: release-assets/*
          if-no-files-found: error
          retention-days: 14

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Resolve prerelease flag
        id: meta
        run: |
          TAG="${GITHUB_REF_NAME}"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          case "${TAG}" in
            v0.*) echo "prerelease=true" >> "$GITHUB_OUTPUT" ;;
            *) echo "prerelease=false" >> "$GITHUB_OUTPUT" ;;
          esac

      - name: Download all platform artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: List release assets
        id: assets
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=(release-assets/*)
          # Expect a cc-switch-like set: linux×2 arches×3 + win×2 arches×2 + mac×2 ≈ 12
          if [ "${#files[@]}" -lt 8 ]; then
            echo "Expected a broad installer set (>=8), found ${#files[@]}" >&2
            find release-assets -type f -print || true
            exit 1
          fi
          echo "count=${#files[@]}" >> "$GITHUB_OUTPUT"
          ls -lah release-assets

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: ${{ steps.meta.outputs.tag }}
          generate_release_notes: true
          prerelease: ${{ steps.meta.outputs.prerelease == 'true' }}
          files: release-assets/*
          body: |
            Exploratory Hamster cut `${{ steps.meta.outputs.tag }}`.

            **Install packages** (unsigned; ${{ steps.assets.outputs.count }} assets), cc-switch-style matrix:
            - **Linux** x64 + arm64: AppImage, `.deb`, `.rpm`
            - **Windows** x64 + arm64: `-Setup.exe` (NSIS), `-Portable.exe`
            - **macOS** arm64 + Intel: `.dmg`, `.zip` (Gatekeeper will warn)

            No code signing / updater signatures yet (unlike cc-switch `.sig` / `latest.json`).

            See `CHANGELOG.md` for human-written notes. Compose contract evidence
            (when available) lives under `docs/p0-report.md`.
