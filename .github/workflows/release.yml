# Multi-arch / multi-format Electron installers → one GitHub Release.
# Asset coverage mirrors cc-switch-style releases (AppImage/deb/rpm, Setup+Portable,
# macOS dmg/zip for arm64 + Intel), without signing / updater / notarization yet.
# Repo is public; macOS is required (both arches built on macos-latest).
name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-x64
            os: ubuntu-22.04
            dist_script: dist:linux
            electron_args: --x64
          - platform: linux-arm64
            # Cross-package on x64: electron-builder's bundled fpm is x86-only.
            os: ubuntu-22.04
            dist_script: dist:linux
            electron_args: --arm64
          - platform: windows-x64
            os: windows-2022
            dist_script: dist:win
            electron_args: --x64
          - platform: windows-arm64
            os: windows-11-arm
            dist_script: dist:win
            electron_args: --arm64
          # Both Apple Silicon + Intel on macos-latest (avoids scarce macos-13 queue).
          - platform: macos
            os: macos-latest
            dist_script: dist:mac
            electron_args: --arm64 --x64
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: electron/package-lock.json

      - name: Install Linux packaging deps (rpm)
        if: runner.os == 'Linux'
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends rpm

      - name: Install Electron package deps
        working-directory: electron
        run: npm ci

      - name: Build ${{ matrix.platform }} packages
        working-directory: electron
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: npm run ${{ matrix.dist_script }} -- ${{ matrix.electron_args }}

      - name: Collect assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-assets
          shopt -s nullglob
          for f in electron/dist/*.AppImage electron/dist/*.deb electron/dist/*.rpm \
                   electron/dist/*.exe electron/dist/*.dmg electron/dist/*.zip; do
            base="$(basename "$f")"
            dest="$base"
            dest="${dest//-linux-/-Linux-}"
            dest="${dest//-mac-/-macOS-}"
            dest="${dest//-win-/-Windows-}"
            cp -f "$f" "release-assets/$dest"
            echo "asset: $dest"
          done
          count=$(find release-assets -type f | wc -l | tr -d ' ')
          echo "Collected $count assets for ${{ matrix.platform }}"
          ls -lah release-assets
          if [ "$count" -lt 1 ]; then
            echo "No release assets produced" >&2
            ls -lah electron/dist || true
            exit 1
          fi
          if [ "${{ matrix.platform }}" = "macos" ] && [ "$count" -lt 4 ]; then
            echo "Expected arm64+x64 dmg+zip (>=4) for macOS, found $count" >&2
            exit 1
          fi

      - name: Upload ${{ matrix.platform }} artifacts
        uses: actions/upload-artifact@v4
        with:
          name: hamster-${{ matrix.platform }}
          path: release-assets/*
          if-no-files-found: error
          retention-days: 14

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Resolve prerelease flag
        id: meta
        run: |
          TAG="${GITHUB_REF_NAME}"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          case "${TAG}" in
            v0.*) echo "prerelease=true" >> "$GITHUB_OUTPUT" ;;
            *) echo "prerelease=false" >> "$GITHUB_OUTPUT" ;;
          esac

      - name: Download all platform artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: List release assets
        id: assets
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=(release-assets/*)
          # linux×2×3 + win×2×2 + mac×2×2 = 14
          if [ "${#files[@]}" -lt 12 ]; then
            echo "Expected full multi-platform installer set (>=12), found ${#files[@]}" >&2
            find release-assets -type f -print || true
            exit 1
          fi
          # Require macOS presence
          mac_count=$(find release-assets -type f \( -name '*.dmg' -o -name '*.zip' \) | wc -l | tr -d ' ')
          if [ "$mac_count" -lt 4 ]; then
            echo "macOS is required: expected >=4 dmg/zip, found $mac_count" >&2
            exit 1
          fi
          echo "count=${#files[@]}" >> "$GITHUB_OUTPUT"
          ls -lah release-assets

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: ${{ steps.meta.outputs.tag }}
          generate_release_notes: true
          prerelease: ${{ steps.meta.outputs.prerelease == 'true' }}
          files: release-assets/*
          body: |
            Exploratory Hamster cut `${{ steps.meta.outputs.tag }}`.

            **Install packages** (unsigned; ${{ steps.assets.outputs.count }} assets):
            - **Linux** x64 + arm64: AppImage, `.deb`, `.rpm`
            - **Windows** x64 + arm64: `-Setup.exe` (NSIS), `-Portable.exe`
            - **macOS** arm64 + Intel: `.dmg`, `.zip` (Gatekeeper will warn)

            No code signing / updater signatures yet (unlike cc-switch `.sig` / `latest.json`).

            See `CHANGELOG.md` for human-written notes.
