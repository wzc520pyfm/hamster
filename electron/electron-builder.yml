# Minimal private Linux x64 packaging config for the P1 Electron candidate port.
# Trial-only: no signing, no publish targets, no auto-update wiring (out of scope).
# PACKAGING-FIX after MF1/N1: include mainIpcAuth.cjs + notifyPendingApprovals.cjs
# (required by main.js; omitted from pre-MF1 files list).
#
# SANDBOX mustfix: linux.executableArgs: [] overrides legacy fuse2 default
# desktop Exec=AppRun --no-sandbox. afterPack installs fail-closed AppRun that
# overwrites vendor generateAppRunScript (fail-open on unshare probe).
appId: com.hamster.p1.electron
productName: Hamster
# Versioned release asset name (uploaded by .github/workflows/release.yml).
artifactName: hamster-${version}-linux-${arch}.${ext}
directories:
  output: dist
afterPack: ./appimageAfterPack.cjs
linux:
  target: AppImage
  maintainer: hamster
  category: Utility
  # Empty array required: omitting executableArgs restores upstream default ["--no-sandbox"].
  executableArgs: []
files:
  - main.js
  - preload.js
  - gate.html
  - hamsterOrigin.cjs
  - sessionStore.cjs
  - windowLoadGuard.cjs
  - mainIpcAuth.cjs
  - notifyPendingApprovals.cjs
  - build/**
  - package.json
