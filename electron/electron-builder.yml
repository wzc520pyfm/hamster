# Minimal private Linux x64 packaging config for the P1 Electron candidate port.
# Trial-only: no signing, no publish targets, no auto-update wiring (out of scope).
# PACKAGING-FIX after MF1/N1: include mainIpcAuth.cjs + notifyPendingApprovals.cjs
# (required by main.js; omitted from pre-MF1 files list). Distinct artifact name
# so PRE-FIX AppImage 67c039d… is never overwritten.
appId: com.hamster.p1.electron
productName: Hamster
artifactName: hamster-p1-electron-handler-regressions-linux-x64
linux:
  target: AppImage
  maintainer: hamster
  category: Utility
files:
  - main.js
  - preload.js
  - gate.html
  - hamsterOrigin.cjs
  - sessionStore.cjs
  - windowLoadGuard.cjs
  - mainIpcAuth.cjs
  - notifyPendingApprovals.cjs
  - build/**
  - package.json
