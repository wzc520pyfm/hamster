services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: hamster
      POSTGRES_USER: hamster
      POSTGRES_PASSWORD: ${HAMSTER_DB_PASSWORD:-changeme}
    volumes:
      - pg_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  api:
    build: ./api
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://hamster:${HAMSTER_DB_PASSWORD:-changeme}@db:5432/hamster
      SECRET_KEY: ${HAMSTER_SECRET_KEY:-super-secret-change-me}
    depends_on:
      - db
    ports:
      - "8080:8080"

  client:
    build: ./client
    restart: unless-stopped
    environment:
      VITE_API_BASE_URL: http://localhost:8080
    ports:
      - "3000:3000"

volumes:
  pg_data: